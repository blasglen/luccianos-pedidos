<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pedidos Lucciano's</title>

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#121212" />

    <!-- iOS "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pedidos" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <script>
      // Pinta el fondo con el color del tema antes de que cargue la app (evita la franja blanca arriba en iPhone).
      (function () {
        try {
          var t = localStorage.getItem("luccianos-theme");
          if (t !== "day" && t !== "night") { var h = new Date().getHours(); t = h >= 7 && h < 20 ? "day" : "night"; }
          var bg = t === "day" ? "#E6D3C2" : "#121212";
          document.documentElement.style.backgroundColor = bg;
          var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("%BASE_URL%service-worker.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
